[project]
name = "napishtimvault"
version = "1.0.0"
description = "A secure password manager with PyQt6 UI"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
